[package]
name = "clidex"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
autobins = false
description = "CLI tool discovery for AI agents: search thousands of CLI tools for install commands, usage examples, and docs links as JSON/YAML, from the shell or an MCP server"
license = "MIT"
repository = "https://github.com/syshin0116/clidex"
homepage = "https://github.com/syshin0116/clidex"
readme = "README.md"
keywords = ["cli", "search", "ai-agent", "developer-tools", "mcp"]
categories = ["command-line-utilities", "development-tools"]
default-run = "clidex"

[[bin]]
name = "clidex"
path = "src/main.rs"

[[bin]]
name = "build_index"
path = "src/bin/build_index.rs"
required-features = ["index-builder"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tokio = { version = "1.54.1", features = ["full"] }
colored = "3.1.1"
bm25 = "2.3.2"
dirs = "7.0.0"
regex = "1.13.1"
nucleo-matcher = "0.3.1"
model2vec-rs = { version = "0.3.0", optional = true }
futures = "0.3.34"
terminal_size = "0.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11.0"
ruzstd = "0.9.1"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
strip = true

[features]
default = []
semantic = ["dep:model2vec-rs"]
index-builder = []
