[package]
name = "clidex"
version = "0.4.0"
edition = "2021"
rust-version = "1.86"
autobins = false
description = "CLI tool discovery for AI agents: search, compare, and install 5,000+ CLI tools with structured YAML/JSON output"
license = "MIT"
repository = "https://github.com/syshin0116/clidex"
homepage = "https://github.com/syshin0116/clidex"
readme = "README.md"
keywords = ["cli", "search", "ai-agent", "developer-tools", "bm25"]
categories = ["command-line-utilities", "development-tools"]
default-run = "clidex"

[[bin]]
name = "clidex"
path = "src/main.rs"

[[bin]]
name = "build_index"
path = "src/bin/build_index.rs"
required-features = ["index-builder"]

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
tokio = { version = "1.53.1", features = ["full"] }
colored = "3.1.1"
bm25 = "2.3.2"
dirs = "6.0.0"
regex = "1.13.1"
nucleo-matcher = "0.3.1"
model2vec-rs = { version = "0.2.1", optional = true }
futures = "0.3.33"
terminal_size = "0.4.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
strip = true

[features]
default = []
semantic = ["dep:model2vec-rs"]
index-builder = []
