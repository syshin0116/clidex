name: Build Index

on:
  schedule:
    # Every day at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build index builder
        run: cargo build --release --bin build_index --features index-builder

      - name: Download previous index for stars cache
        run: |
          curl -fsSL -o prev_index.yaml \
            https://github.com/${{ github.repository }}/releases/download/index/index.yaml \
            2>/dev/null || echo "No previous index found, building from scratch"

      - name: Build index
        run: |
          if [ -f prev_index.yaml ]; then
            ./target/release/build_index index.yaml prev_index.yaml
          else
            ./target/release/build_index index.yaml
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LIMIT: 5000
          CRATES_LIMIT: 1000
          NPM_LIMIT: 500
          LLMS_LIMIT: 500
          TOOLLEEO_LIMIT: 500

      - name: Verify generated index quality
        run: |
          mkdir -p ~/.clidex
          cp index.yaml ~/.clidex/index.yaml
          cargo test --test index_coverage_test -- --nocapture

      - name: Update tool count in README and docs
        run: |
          COUNT=$(grep -c '^- name:' index.yaml)
          FORMATTED=$(python3 -c "print(f'{int('"$COUNT"'):,}')")
          sed -i -E "s/[0-9,]+\+ command-line tools/${FORMATTED}+ command-line tools/g" README.md docs/index.html
          sed -i -E "s/[0-9,]+\+ tool index/${FORMATTED}+ tool index/g" README.md
          echo "FORMATTED=${FORMATTED}" >> "$GITHUB_ENV"

      - name: Commit updated counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add README.md docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update tool count to ${FORMATTED}"
            git push
          else
            echo "No count changes to commit"
          fi

      - name: Upload index as release asset
        run: |
          # Delete existing release if it exists (ignore errors)
          gh release delete index --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          # Create new release with index file
          gh release create index \
            --title "Latest Index" \
            --notes "Auto-generated CLI tool index. Updated daily." \
            --latest=false \
            index.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
