name: Build Index

on:
  schedule:
    # Every day at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Artifact attestations for the published index.
  id-token: write
  attestations: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build index builder
        run: cargo build --locked --release --bin build_index --features index-builder,semantic

      - name: Download previous index for stars cache
        run: |
          curl -fsSL -o prev_index.yaml \
            https://github.com/${{ github.repository }}/releases/download/index/index.yaml \
            2>/dev/null || echo "No previous index found, building from scratch"

      - name: Download tldr pages
        run: |
          curl -fsSL -o tldr.zip https://github.com/tldr-pages/tldr/releases/latest/download/tldr-pages.en.zip
          unzip -q tldr.zip -d tldr-pages
          echo "TLDR_PAGES_DIR=${{ github.workspace }}/tldr-pages" >> "$GITHUB_ENV"

      - name: Build index
        run: |
          if [ -f prev_index.yaml ]; then
            ./target/release/build_index index.yaml prev_index.yaml
          else
            ./target/release/build_index index.yaml
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LIMIT: 5000
          CRATES_LIMIT: 1000
          NPM_LIMIT: 500
          LLMS_LIMIT: 500
          TOOLLEEO_LIMIT: 500
          # Repology allows about one request per second; results are cached for 30 days.
          REPOLOGY_LIMIT: 600

      - name: Verify generated index quality
        env:
          CLIDEX_INDEX_PATH: ${{ github.workspace }}/index.yaml
        run: cargo test --locked --test index_coverage_test --test search_real_index_test -- --nocapture

      - name: Update tool count in README and docs
        run: |
          COUNT=$(grep -c '^- name:' index.yaml)
          # Round down to the hundred so the "N+" claim stays true without a commit every day.
          FORMATTED=$(python3 -c "print(f'{int('"$COUNT"') // 100 * 100:,}')")
          sed -i -E "s/[0-9,]+\+ command-line tools/${FORMATTED}+ command-line tools/g" README.md docs/index.html
          sed -i -E "s/[0-9,]+\+ tool index/${FORMATTED}+ tool index/g" README.md
          echo "FORMATTED=${FORMATTED}" >> "$GITHUB_ENV"

      - name: Commit updated counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add README.md docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update tool count to ${FORMATTED}"
            git push
          else
            echo "No count changes to commit"
          fi

      - name: Write index checksum and compressed copy
        run: |
          sha256sum index.yaml > index.yaml.sha256
          zstd -19 -q -f index.yaml -o index.yaml.zst

      - name: Attest index provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            index.yaml
            index.yaml.zst
            index.embeddings.bin

      - name: Upload index as release asset
        run: |
          if ! gh release view index >/dev/null 2>&1; then
            gh release create index --title "Latest Index" \
              --notes "Auto-generated CLI tool index. Updated daily." --latest=false
          fi
          gh release upload index index.embeddings.bin --clobber
          gh release upload index index.yaml index.yaml.zst --clobber
          gh release upload index index.yaml.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
