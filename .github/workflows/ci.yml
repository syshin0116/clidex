name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.86.0
      - name: Check minimum supported Rust
        run: cargo check --locked --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check
        run: cargo check --all-targets

      - name: Check (semantic feature)
        run: cargo check --all-targets --features semantic

      - name: Test (unit + fixture)
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Clippy (semantic feature)
        run: cargo clippy --features semantic -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Download real index
        run: |
          mkdir -p ~/.clidex
          curl -fsSL -o ~/.clidex/index.yaml \
            https://github.com/syshin0116/clidex/releases/download/index/index.yaml
          echo "Index size: $(wc -c < ~/.clidex/index.yaml) bytes"

      - name: Integration tests (real index)
        run: cargo test --test search_real_index_test -- --nocapture

      - name: Coverage tests (index quality)
        run: cargo test --test index_coverage_test -- --nocapture

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check
    if: always()
    needs: [msrv, test, integration, security]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          test "$MSRV_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
