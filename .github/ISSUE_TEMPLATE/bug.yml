name: Bug report
description: Report reproducible incorrect behavior in clidex.
title: "[bug]: "
labels:
  - bug
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the exact command, output, and expected behavior.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clidex version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Linux aarch64
        - macOS Intel
        - macOS Apple Silicon
        - Windows x86_64
        - Other
    validations:
      required: true
